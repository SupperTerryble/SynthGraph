# ==============================================================================
#  SynthGraph — config/settings.yaml
#  Toutes les constantes du projet sont définies ici.
# ==============================================================================

project:
  name: "SynthGraph"
  version: "4.4.0"
  description: "Multi-Agents LLM pour extraction de voies de synthèse inorganique"

# Moteur LLM local (in-process llama-cpp-python)
# Surchargeable par variable d'env SYNTHGRAPH_MODEL_PATH
llm:
  model_path:   "${MODELS_DIR}/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf"
  n_ctx:        8192
  n_gpu_layers: -1        # -1 = tout sur GPU
  n_batch:      4096
  base_url:     "http://localhost:11434"   # vestigial (inférence in-process)

# [Phase 0 — plan multi-modèles] Modèle par rôle. `default` définit le GGUF de
# base ; chaque rôle pointe vers un alias via `alias: <nom>`. Tant que tous les
# rôles pointent sur `default`, comportement strictement identique à `llm:`
# ci-dessus (lu en fallback si cette section est absente). Un seul modèle tient
# en VRAM à la fois (RTX 3070 8 Go) : changer l'alias d'un rôle déclenche un
# swap (décharger/recharger) au prochain appel de ce rôle, jamais une
# cohabitation de deux gros modèles.
models:
  default:
    path: "${MODELS_DIR}/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf"
    n_ctx: 8192
  extractor:  {alias: default}
  qa:         {alias: default}
  strategist: {alias: default}

# Système / GPU — surchargeable par variable d'env CUDA_PATH
system:
  cuda_path: "C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v13.3"

# Chemins des fichiers (relatifs à la racine du projet)
paths:
  data_dir:           "data"
  logs_dir:           "logs"
  assignment_file:    "logs/model_assignment.json"
  benchmark_report:   "logs/benchmark_report.md"
  execution_log:      "logs/execution_log.md"
  cypher_output:      "logs/cypher_output.cypher"
  gemini_log:         "Gemini_update.log"

# Ollama LLM (Local)
ollama:
  base_url:     "http://localhost:11434"
  timeout:      180
  max_tokens:   2048
  temperature:  0.1
  num_retries:  2
  # Modèles par défaut (écrasés par logs/model_assignment.json après benchmark)
  default_reasoning_model: "llama3.2:latest"
  default_fast_model:      "llama3.2:latest"

# [V4.8] Agent Vision (PaliGemma, swap VRAM avec le modèle texte)
vision:
  # ACTIVÉ 2026-07-13 : Qwen2.5-VL-3B via SOUS-PROCESSUS JETABLE (vision_worker.py).
  # Smoke test passé (worker charge/répond/meurt proprement, aucune corruption CUDA).
  # Un crash natif éventuel du worker ne tue plus le process pipeline.
  enabled:     true
  model_path:  "${MODELS_DIR}/Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf"   # [V4.10] Qwen-VL (PaliGemma legacy → crashs)
  mmproj_path: "${MODELS_DIR}/mmproj-Qwen2.5-VL-3B-Instruct-f16.gguf"
  max_queries: 4      # questions max par route (coût swap ~30-60s)

# Neo4j
neo4j:
  uri:      "bolt://localhost:7687"
  user:     "neo4j"
  password: "${NEO4J_PASSWORD}"      # défini via variable d'environnement
  database: "synthgraph"

# Agents — paramètres de débat
debate:
  max_rounds:            3
  confidence_threshold:  0.75    # Seuil pour accepter une extraction
  enable_debate_log:     true

# Chunking du document
chunking:
  max_chunk_chars:   3000
  overlap_chars:     200
  section_markers:   ["experimental", "synthesis", "preparation", "materials and methods",
                      "méthode", "expérimental", "synthèse"]
